
security_audit_task:
  description: >
    Analyze the provided code context for the repository: {repo_url}.
    
    Your audit must focus on:
    - **Secrets Detection:** Look for hardcoded passwords, API keys, or JWT secrets.
    - **OWASP Top 10:** Identify risks like SQL Injection (raw queries), XSS, 
      or Insecure Deserialization.
    - **Insecure Patterns:** Detect the use of 'eval()', 'shell=True' in subprocesses, 
      or weak hashing algorithms (MD5/SHA1).
    - **Dependency Risks:** Point out outdated or vulnerable libraries mentioned 
      in requirements.txt or pyproject.toml.
  expected_output: >
    A detailed markdown security report. It must include:
    - A summary table of found vulnerabilities with Severity (Critical, High, Medium, Low).
    - Precise code snippets where the issues were found.
    - Remediation advice for every identified risk.
    - A 'Security Health Score' from 0 to 100.
  agent: security_analyzer
  output_file: output/security_report.md


performance_analysis_task:
  description: >
    Review the following code bundle from {repo_url}:
    
    {code_bundle}
    
    Tasks:
    1. Identify functions with high algorithmic complexity (e.g., O(n^2) or higher).
    2. Spot blocking I/O operations inside loops.
    3. Suggest where caching (memoization) or better data structures (sets/dicts instead of lists) could be used.
  expected_output: >
    A markdown report 'performance_report.md' containing:
    - A summary of performance bottlenecks.
    - For each issue:
        - Function name -> Folder -> File -> Line number.
        - Big O Analysis (Current vs. Target).
        - Description of the bottleneck.
        - **Refactored Version**: A code block with the optimized version of the function.
  agent: performance_profiler
  output_file: output/performance_report.md


final_report_task:
  description: >
    Read all markdown files in the /output folder (security_report.md, bug_report.md, etc.).
    Your goal is to consolidate them into a single 'final_report.md' using a 
    standardized hierarchy.
    
    You MUST categorize the 'Technical Details' section into exactly these sub-sections:
    1. **Security Vulnerabilities** (From Security Agent)
    2. **Logic & Runtime Bugs** (From BugDetector Agent)
    3. **Code Quality & Technical Debt** (General improvements)
    4. **Performance & Optimization** (If applicable)

    For each section, highlight the 'Criticality' of the findings. 
    If a report file is missing for a category, simply state 'No issues detected in this category'.
  expected_output: >
    A unified markdown file 'final_report.md'. 
    It must use ## for category headers and ### for specific issues to maintain 
    a clean document structure. No repetitive introductions from the sub-reports.
    Task instructions: calculate an overall score 0 to 100 using weighted formula (bugs -5 each max -20, 
    security -10 each max -25, performance -3 each max -15, style -1 each max -10, tech debt -0.5 per TODO max -10, CVEs -5 each max -20).
      The final report should start with an 'Executive Summary' that includes:
    - Overall Health Score (0 to 100).
    - A brief overview of the most critical issues.
    - A prioritized list of remediation steps for developers.
  agent: review_leader
  output_file: output/final_report.md


bug_detection_task:
  description: >
    Review the following code bundle from {repo_url}:
    
    CODE BUNDLE:
    {code_bundle}
    
    Analyze the logic, identify potential bugs, and suggest fixes.
  expected_output: >
    A complete markdown report. It should include:
    - A summary table of findings.
    - Detailed sections for each bug (File, Line, Issue, Fix).
    - A 'Code Quality' assessment.
  agent: bug_detector
  output_file: output/bug_report.md



style_review_task:
  description: >
    Review the following code bundle from {repo_url}:

    {code_bundle}
    
    Your style audit must focus on:
    - **Naming Conventions:** Flag any camelCase/snake_case mixing, unclear
      variable names (e.g., `x`, `tmp`, `data2`), or inconsistent casing.
    - **Formatting:** Identify lines exceeding 79 characters (PEP8), missing
      blank lines between functions/classes, or improper indentation.
    - **Documentation:** Flag missing docstrings on public functions/classes,
      absent inline comments on complex logic, or outdated comments.
    - **Code Readability:** Detect deeply nested blocks (3+ levels), functions
      longer than 50 lines, and magic numbers/strings without constants.
    - **Dead Code:** Identify unused imports, unreachable code, or commented-out
      code blocks left in production files.
  expected_output: >
    A markdown report 'style_report.md' containing:
    - A summary table of style violations with Severity (High, Medium, Low).
    - For each issue:
        - Rule violated -> File -> Line number.
        - **Before**: the original offending snippet.
        - **After**: the corrected, clean version.
    - A 'Style Health Score' from 0 to 100.
  agent: style_reviewer
  output_file: output/style_report.md